name: train

# 借用 GitHub Actions 的算力做真正的预训练: 每个模型配置一个 job, job 内部再用
# tools/parallel_pretrain.py 开 N 个 worker 做同步数据并行 (4 vCPU runner 开 4 路)。
# 公开仓库的 standard runner 不计费, 单 job 上限 6 小时。
on:
  workflow_dispatch:
    inputs:
      config:
        description: 训练哪个配置 (all = 全部并行跑, 便于横向对比)
        type: choice
        default: all
        options: [all, d64-L2-ctx128, d128-L3-ctx192, d192-L4-ctx256, d256-L6-ctx384]
      minutes:
        description: 每个 job 训练多少分钟 (runner 单 job 硬上限 6 小时)
        type: string
        default: "60"
      workers:
        description: 每个 job 开几个数据并行 worker (runner 的 vCPU 有配额, 多进程会被节流 ~20 倍, 保持 1)
        type: string
        default: "1"
      data_seed:
        description: 数据采样种子 (同一配置开多个 job 时用不同值, 模型初值仍相同)
        type: string
        default: "1234"
      task_frac:
        description: 答案+EOS 监督步占比（0=纯 LM；0.25=每 4 步 1 步监督）
        type: string
        default: "0"
      replicas:
        description: 同一配置开几个副本 (各自独立 runner, 相同初值/不同 data_seed, 结束后自动权重平均)
        type: string
        default: "1"
      sync_steps:
        description: 每轮平均权重的步数
        type: string
        default: "25"
      dialogue_chars:
        description: 语料里对话字符数 (日常智能的主要来源)
        type: string
        default: "24000000"
      math_chars:
        description: 语料里数学字符数
        type: string
        default: "12000000"
      code_chars:
        description: 语料里代码字符数 (0 = 不联网下载, 最快)
        type: string
        default: "4000000"
      chinese_chars:
        description: 真实中文 (维基) 字符数; >0 会下载 ~3.5GB zhwiki dump (+~5GB 磁盘, +~10 分钟)
        type: string
        default: "0"

permissions:
  contents: write

jobs:
  # 用 prepare 计算矩阵: 矩阵不能出现在 jobs.<id>.if 里 (会判定 workflow 无效)
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          CFG: ${{ inputs.config }}
          REPLICAS: ${{ inputs.replicas }}
          DATA_SEED: ${{ inputs.data_seed }}
        run: |
          # 展开成 include 矩阵: 每个配置 x 每个副本, 副本用不同 data_seed
          # (模型初值仍由 --seed 固定, 因此各副本之间可以直接平均权重)
          if [ "$CFG" = "all" ]; then
            CONFIGS='["d64-L2-ctx128","d128-L3-ctx192","d192-L4-ctx256","d256-L6-ctx384"]'
          else
            CONFIGS=$(jq -nc --arg c "$CFG" '[$c]')
          fi
          MATRIX=$(jq -nc --argjson cfgs "$CONFIGS" --argjson n "$REPLICAS" \
                          --argjson seed "$DATA_SEED" \
            '{include: [ $cfgs[] as $c | range(0; $n) as $r
                         | {config: $c, replica: $r, data_seed: ($seed + $r)} ]}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  train:
    name: train ${{ matrix.config }} r${{ matrix.replica }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --locked

      - name: 构建语料 (对话优先)
        run: |
          uv run enoch-build-corpus \
            --target-chars $((${{ inputs.dialogue_chars }} + ${{ inputs.math_chars }} + ${{ inputs.code_chars }} + ${{ inputs.chinese_chars }})) \
            --dialogue-chars ${{ inputs.dialogue_chars }} \
            --math-chars ${{ inputs.math_chars }} \
            --code-chars ${{ inputs.code_chars }} \
            --chinese-chars ${{ inputs.chinese_chars }} \
            --shard-chars 8000000 \
            --out-dir data/corpus
          du -sh data/corpus && df -h /home/runner | tail -1

      - name: 拼装 token 池
        run: |
          uv run enoch-pool --corpus-dir data/corpus --out /tmp/pool.npz \
            --dialogue-chars ${{ inputs.dialogue_chars }} \
            --math-chars ${{ inputs.math_chars }} \
            --code-chars ${{ inputs.code_chars }} \
            --chinese-chars ${{ inputs.chinese_chars }} \
            --val-chars 200000 --stats /tmp/pool_stats.json
          cat /tmp/pool_stats.json

      - name: 数据并行预训练
        run: |
          uv run python tools/parallel_pretrain.py \
            --config ${{ matrix.config }} \
            --workers ${{ inputs.workers }} \
            --minutes ${{ inputs.minutes }} \
            --sync-steps ${{ inputs.sync_steps }} \
            --data-seed ${{ matrix.data_seed }} \
            --task-frac ${{ inputs.task_frac }} \
            --pool /tmp/pool.npz \
            --out-dir out/${{ matrix.config }}-r${{ matrix.replica }} \
            --tag ${{ matrix.config }}-r${{ matrix.replica }}

      - name: 训练摘要
        if: always()
        run: |
          {
            echo "### train ${{ matrix.config }} r${{ matrix.replica }}"
            echo '```json'
            cat out/${{ matrix.config }}-r${{ matrix.replica }}/train_report.json 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 checkpoint + 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckpt-${{ matrix.config }}-r${{ matrix.replica }}
          path: out/${{ matrix.config }}-r${{ matrix.replica }}/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: 汇总结果 / 归档最佳模型
    needs: train
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: 重建语料池 (多副本平均时用于验证集)
        if: inputs.replicas != '1'
        run: |
          uv run enoch-build-corpus \
            --target-chars $((${{ inputs.dialogue_chars }} + ${{ inputs.math_chars }} + ${{ inputs.code_chars }} + ${{ inputs.chinese_chars }})) \
            --dialogue-chars ${{ inputs.dialogue_chars }} \
            --math-chars ${{ inputs.math_chars }} \
            --code-chars ${{ inputs.code_chars }} \
            --chinese-chars ${{ inputs.chinese_chars }} \
            --shard-chars 8000000 --out-dir data/corpus
          uv run enoch-pool --corpus-dir data/corpus --out /tmp/pool.npz \
            --dialogue-chars ${{ inputs.dialogue_chars }} \
            --math-chars ${{ inputs.math_chars }} \
            --code-chars ${{ inputs.code_chars }} \
            --chinese-chars ${{ inputs.chinese_chars }} \
            --val-chars 200000

      - name: 同配置多副本 -> 权重平均
        if: inputs.replicas != '1'
        run: |
          uv run python tools/merge_replicas.py --root artifacts \
            --pool /tmp/pool.npz --json reports/merge.json \
            --val-chars 200000 --eval-n 20

      - name: 汇总所有 job 的报告
        id: collect
        run: |
          uv run python tools/collect_ci_reports.py --root artifacts \
            --out reports/latest.json --summary "$GITHUB_STEP_SUMMARY" \
            --best-file /tmp/best_dir.txt
          echo "best_dir=$(cat /tmp/best_dir.txt)" >> "$GITHUB_OUTPUT"

      - name: 把最佳 checkpoint 归档到 ci-checkpoints 分支
        if: steps.collect.outputs.best_dir != ''
        env:
          BEST_DIR: ${{ steps.collect.outputs.best_dir }}
          # run: 步骤里不会自动有 GITHUB_TOKEN, 必须显式映射 (否则 set -u 直接报错)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN (GitHub App) 不允许创建/更新 workflow 文件, 而从 master
          # 拉分支会带上 .github/workflows/* -> 推送被拒。所以归档用**孤儿分支**,
          # 只装模型与报告, 不含任何 workflow 文件。
          rm -rf /tmp/archive && mkdir -p /tmp/archive
          cp -r "$BEST_DIR/." /tmp/archive/
          cp reports/latest.json /tmp/archive/ci_summary.json
          {
            echo "# EnochModel1 CI 训练归档 (孤儿分支, 只装产物)"
            echo
            echo "- run_id: ${{ github.run_id }}"
            echo "- 最佳配置: $(jq -r .best reports/latest.json)"
            echo "- 归档时间 (UTC): $(date -u +%FT%TZ)"
          } > /tmp/archive/README.md
          cd /tmp/archive
          git init -q -b ci-checkpoints
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ci: 归档 run ${{ github.run_id }} 的最佳模型"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-checkpoints

      - name: 上传汇总报告
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: reports/
          if-no-files-found: warn
